version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: ${REDIS_CONTAINER_NAME:-instagram-chat-redis}
    env_file:
      - .env.local
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: postgres:15-alpine
    container_name: ${POSTGRES_CONTAINER_NAME:-instagram-chat-postgres}
    environment:
      POSTGRES_DB: ${DB_NAME:-instagram_chat}
      POSTGRES_USER: ${DB_USER:-instagram_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-instagram_password}
    ports:
      - '${DB_PORT:-5432}:5432'
    env_file:
      - .env.local
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-instagram_user} -d ${DB_NAME:-instagram_chat}']
      interval: 30s
      timeout: 10s
      retries: 3

  migrate:
    image: node:18-alpine
    container_name: ${MIGRATE_CONTAINER_NAME:-instagram-chat-migrate}
    working_dir: /app
    env_file:
      - .env.local
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-instagram_chat}
      DB_USER: ${DB_USER:-instagram_user}
      DB_PASSWORD: ${DB_PASSWORD:-instagram_password}
    volumes:
      - ./:/app
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - migrate
    command: sh -c "npm install && npm run migrate:up"

  app:
    image: node:18-alpine
    container_name: ${APP_CONTAINER_NAME:-instagram-chat-app}
    working_dir: /app
    env_file:
      - .env.local
    environment:
      DATABASE_URL: postgresql://instagram_user:instagram_password@postgres:5432/instagram_chat
      REDIS_URL: redis://redis:6379
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-instagram_chat}
      DB_USER: ${DB_USER:-instagram_user}
      DB_PASSWORD: ${DB_PASSWORD:-instagram_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CORS_ALLOW_ORIGIN: '*'
    ports:
      - '3000:3000'
      - '8088:8088'
    volumes:
      - ./:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "npm install && npm run dev:full"

volumes:
  redis_data:
  postgres_data:

networks:
  default:
    name: ${NETWORK_NAME:-instagram-chat-network}
