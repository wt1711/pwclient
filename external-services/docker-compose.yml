version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: ${REDIS_CONTAINER_NAME:-instagram-chat-redis}
    env_file:
      - .env.local
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: postgres:15-alpine
    container_name: ${POSTGRES_CONTAINER_NAME:-instagram-chat-postgres}
    environment:
      POSTGRES_DB: ${DB_NAME:-instagram_chat}
      POSTGRES_USER: ${DB_USER:-instagram_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-instagram_password}
    ports:
      - "${DB_PORT:-5432}:5432"
    env_file:
      - .env.local
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-instagram_user} -d ${DB_NAME:-instagram_chat}"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  redis_data:
  postgres_data:

networks:
  default:
    name: ${NETWORK_NAME:-instagram-chat-network}