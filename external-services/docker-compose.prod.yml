version: '3.8'

services:
  # Backend API (Next.js)
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: ${APP_CONTAINER_NAME:-pwclient-api}
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER:-instagram_user}:${DB_PASSWORD:-instagram_password}@postgres:5432/${DB_NAME:-instagram_chat}
      REDIS_URL: redis://redis:6379
      DB_HOST: postgres
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-instagram_chat}
      DB_USER: ${DB_USER:-instagram_user}
      DB_PASSWORD: ${DB_PASSWORD:-instagram_password}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOW_ORIGIN: '*'
    env_file:
      - .env.local
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    networks:
      - backend-network
    healthcheck:
      test:
        ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 10s
      retries: 5
    mem_limit: 1g
    cpus: 1.0
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  # WebSocket Server
  websocket:
    build:
      context: .
      dockerfile: Dockerfile.websocket
    container_name: ${WS_CONTAINER_NAME:-pwclient-websocket}
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:${REDIS_PORT:-6379}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
    env_file:
      - .env.local
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - backend-network
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:8088/health']
      interval: 30s
      timeout: 10s
      retries: 3
    mem_limit: 512m
    cpus: 0.5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: ${REDIS_CONTAINER_NAME:-pwclient-redis}
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    restart: unless-stopped
    networks:
      - backend-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 30s
      timeout: 10s
      retries: 3
    mem_limit: 512m
    cpus: 0.5
    logging:
      driver: 'json-file'
      options:
        max-size: '5m'
        max-file: '3'

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: ${POSTGRES_CONTAINER_NAME:-pwclient-postgres}
    environment:
      POSTGRES_DB: ${DB_NAME:-instagram_chat}
      POSTGRES_USER: ${DB_USER:-instagram_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-instagram_password}
      POSTGRES_INITDB_ARGS: '--encoding=UTF-8 --lc-collate=C --lc-ctype=C'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./external-services/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    restart: unless-stopped
    networks:
      - backend-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-instagram_user} -d ${DB_NAME:-instagram_chat}']
      interval: 30s
      timeout: 10s
      retries: 3
    mem_limit: 1g
    cpus: 1.0
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  # Database Migration
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    container_name: ${MIGRATE_CONTAINER_NAME:-pwclient-migrate}
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-instagram_chat}
      DB_USER: ${DB_USER:-instagram_user}
      DB_PASSWORD: ${DB_PASSWORD:-instagram_password}
    env_file:
      - .env.local
    depends_on:
      - postgres
    networks:
      - backend-network
    restart: 'no'
    mem_limit: 256m
    cpus: 0.25

volumes:
  redis_data:
    driver: local
  postgres_data:
    driver: local

networks:
  backend-network:
    driver: bridge
    name: ${BACKEND_NETWORK_NAME:-pwclient-backend}
    internal: true
